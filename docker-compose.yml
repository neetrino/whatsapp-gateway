services:
  gateway:
    build: .
    image: nbos-whatsapp-gateway:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - WAHA_BASE_URL=http://waha:3000
      - GATEWAY_INTERNAL_URL=http://gateway:3000
      - DATABASE_URL=file:/app/data/gateway.db
    volumes:
      - gateway_data:/app/data
    depends_on:
      - waha
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://127.0.0.1:3000/ready >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  waha:
    image: devlikeapro/waha:noweb-2026.8.1
    restart: unless-stopped
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
    volumes:
      - waha_sessions:/app/.sessions
    expose:
      - '3000'

volumes:
  gateway_data:
  waha_sessions:
