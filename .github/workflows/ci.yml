name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: file:./data/ci.db

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./data/ci.db

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
        env:
          NODE_ENV: test
          PORT: '3000'
          APP_URL: http://localhost:3000
          DATABASE_URL: file:./data/ci.db
          COOKIE_SECRET: ci-cookie-secret-32-characters-min!!
          JWT_SECRET: ci-jwt-secret-32-characters-minimum!!
          TOKEN_PEPPER: ci-token-pepper-32-characters-min!!
          WAHA_BASE_URL: http://127.0.0.1:3999
          WAHA_WEBHOOK_SECRET: ci-waha-webhook-secret-32-chars-min!!
          GATEWAY_INTERNAL_URL: http://gateway:3000

      - name: Build
        run: npm run build
